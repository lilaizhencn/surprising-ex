server:
  port: 9094

spring:
  application:
    name: surprising-edge-provider
  main:
    keep-alive: true
  threads:
    virtual:
      enabled: true
  task:
    scheduling:
      pool:
        size: 4
      thread-name-prefix: edge-scheduler-
      shutdown:
        await-termination: true
        await-termination-period: 10s
  datasource:
    url: jdbc:postgresql://localhost:5432/surprising_exchange
    username: surprising
    password: surprising
    hikari:
      maximum-pool-size: 12
      minimum-idle: 2
      connection-timeout: 3000
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

surprising:
  edge:
    local-base-url: http://localhost:9094
  gateway:
    http-client:
      # 订单接口会等待用户分区命令的 Kafka 结果；读超时必须覆盖命令等待和一次重平衡窗口。
      connect-timeout: ${GATEWAY_CONNECT_TIMEOUT:1s}
      read-timeout: ${GATEWAY_READ_TIMEOUT:30s}
  websocket:
    kafka:
      bootstrap-servers: localhost:9092
      product-line: ${PRODUCT_LINE}
      product-topics-enabled: ${PRODUCT_TOPICS_ENABLED}
      group-id: surprising-edge-websocket-${HOSTNAME:${random.uuid}}
      concurrency: 2
      max-poll-records: 1000
    security:
      allow-query-user-id-fallback: ${SURPRISING_WS_QUERY_USER_ID:true}
      jwt-secret: ${SURPRISING_WEBSOCKET_JWT_SECRET:local-dev-change-me-surprising-ex-gateway-secret-2026}
      allowed-origins:
        - ${SURPRISING_WS_ALLOWED_ORIGIN:*}
