server:
  port: ${DERIVATIVES_LIFECYCLE_PORT:9087}

spring:
  application:
    name: surprising-derivatives-lifecycle
  task:
    scheduling:
      pool:
        size: ${DERIVATIVES_LIFECYCLE_SCHEDULING_POOL_SIZE:6}
      shutdown:
        await-termination: true
        await-termination-period: 10s
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/surprising_exchange?reWriteBatchedInserts=true}
    username: ${SPRING_DATASOURCE_USERNAME:surprising}
    password: ${SPRING_DATASOURCE_PASSWORD:surprising}
    hikari:
      maximum-pool-size: ${DERIVATIVES_LIFECYCLE_DB_POOL_SIZE:32}
      minimum-idle: 4
      connection-timeout: 3000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

surprising:
  funding:
    kafka:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
      product-line: ${PRODUCT_LINE:LINEAR_PERPETUAL}
      cache-group-id: surprising-funding-rate-cache-${HOSTNAME:${random.uuid}}
      concurrency: 1
      max-poll-records: 500
  risk:
    product-line: ${PRODUCT_LINE:LINEAR_PERPETUAL}
    aeron:
      hostnames: ${AERON_CLUSTER_HOSTNAMES:localhost,localhost,localhost}
      egress-hostname: ${AERON_EGRESS_HOSTNAME:localhost}
      response-timeout: ${AERON_RESPONSE_TIMEOUT:5s}
      client-connections: ${AERON_CLIENT_CONNECTIONS:2}
  liquidation:
    product-line: ${PRODUCT_LINE:LINEAR_PERPETUAL}
    aeron:
      client-connections: ${AERON_CLIENT_CONNECTIONS:2}
  insurance:
    aeron:
      hostnames: ${AERON_CLUSTER_HOSTNAMES:localhost,localhost,localhost}
      egress-hostname: ${AERON_EGRESS_HOSTNAME:localhost}
      response-timeout: ${AERON_RESPONSE_TIMEOUT:5s}
      client-connections: ${AERON_CLIENT_CONNECTIONS:2}
    kafka:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
      product-line: ${PRODUCT_LINE:LINEAR_PERPETUAL}
      concurrency: 2
      max-poll-records: 500
  price:
    consumer:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
      product-line: ${PRODUCT_LINE:LINEAR_PERPETUAL}
      group-id: surprising-adl-mark-price-${HOSTNAME:${random.uuid}}
      max-age: 5s
      allowed-future-skew: 1s
      concurrency: 1
      max-poll-records: 500
