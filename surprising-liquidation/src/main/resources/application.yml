server:
  port: 9088

spring:
  application:
    name: surprising-liquidation
  task:
    scheduling:
      pool:
        size: 1
      thread-name-prefix: liquidation-coordinator-
      shutdown:
        await-termination: true
        await-termination-period: 10s
  datasource:
    url: jdbc:postgresql://localhost:5432/surprising_exchange?reWriteBatchedInserts=true
    username: surprising
    password: surprising
    hikari:
      maximum-pool-size: 8
      minimum-idle: 1
      connection-timeout: 3000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

surprising:
  liquidation:
    product-line: ${PRODUCT_LINE:LINEAR_PERPETUAL}
    aeron:
      hostnames: ${AERON_CLUSTER_HOSTNAMES:localhost,localhost,localhost}
      egress-hostname: ${AERON_EGRESS_HOSTNAME:localhost}
      response-timeout: 5s
      client-connections: 2
    coordinator:
      delay-ms: 25
      work-batch-size: 256
      risk-scan-batch-size: 1024
      max-pages-per-run: ${LIQUIDATION_MAX_PAGES_PER_RUN:8}
      max-work-bytes: ${LIQUIDATION_MAX_WORK_BYTES:1048576}
    execution:
      enabled: true
      liquidation-fee-rate-ppm: 3000
