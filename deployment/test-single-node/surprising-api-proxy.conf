proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $ex_api_connection_upgrade;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# Nginx is the trust boundary; never append arbitrary caller-supplied forwarding chains.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Forwarded "";
proxy_set_header CF-Connecting-IP "";
proxy_set_header True-Client-IP "";
proxy_set_header Fastly-Client-IP "";
proxy_set_header X-Azure-ClientIP "";
proxy_set_header CloudFront-Viewer-Address "";
proxy_set_header X-Client-IP "";
proxy_connect_timeout 5s;
proxy_read_timeout 90s;
proxy_send_timeout 15s;
