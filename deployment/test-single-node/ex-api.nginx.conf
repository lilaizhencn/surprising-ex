# 所有 HTTP 和 WebSocket 请求进入同一个 Gateway，产品线由应用校验和路由。
map $http_upgrade $ex_api_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name ex-api.tokdou.com;

    server_tokens off;
    client_max_body_size 20m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ex-api.tokdou.com;

    ssl_certificate /etc/letsencrypt/live/ex-api.tokdou.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ex-api.tokdou.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    server_tokens off;
    client_max_body_size 20m;

    location = /admin { return 302 /admin/; }

    location ^~ /admin/ {
        root /opt/surprising-ex/web;
        try_files $uri $uri/ /admin/index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:9094/actuator/health/readiness;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # 做市、行情及生命周期进程通过本机/私网访问内部业务契约。
    location ^~ /api/v1/accounts/ { return 404; }
    location ^~ /api/v1/trading/ { return 404; }
    location ^~ /internal/ { return 404; }

    location ^~ /actuator/ {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:9094;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ex_api_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
}
