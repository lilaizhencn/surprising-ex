# 所有 HTTP 和 WebSocket 请求进入同一个 Gateway，产品线由应用校验和路由。
log_format ex_api_safe '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
    '$status $body_bytes_sent request_id=$request_id';
limit_req_zone $binary_remote_addr zone=ex_api_ip:10m rate=300r/s;
limit_conn_zone $binary_remote_addr zone=ex_api_connections:10m;
map $http_origin $ex_api_cors_origin {
    default "";
    https://ex.tokdou.com $http_origin;
}
map $http_upgrade $ex_api_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name ex-api.tokdou.com;

    server_tokens off;
    access_log /var/log/nginx/ex-api.access.log ex_api_safe;
    # Ordinary request failures are visible by status in the sanitized access log.
    error_log /var/log/nginx/ex-api.error.log crit;
    client_max_body_size 1m;
    client_header_timeout 10s;
    client_body_timeout 15s;
    send_timeout 15s;
    keepalive_timeout 20s;
    keepalive_requests 1000;
    large_client_header_buffers 4 8k;
    reset_timedout_connection on;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ex-api.tokdou.com;

    ssl_certificate /etc/letsencrypt/live/ex-api.tokdou.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ex-api.tokdou.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    server_tokens off;
    access_log /var/log/nginx/ex-api.access.log ex_api_safe;
    # Ordinary request failures are visible by status in the sanitized access log.
    error_log /var/log/nginx/ex-api.error.log crit;
    client_max_body_size 1m;
    client_header_timeout 10s;
    client_body_timeout 15s;
    send_timeout 15s;
    keepalive_timeout 20s;
    keepalive_requests 1000;
    large_client_header_buffers 4 8k;
    reset_timedout_connection on;

    limit_req zone=ex_api_ip burst=600 nodelay;
    limit_req_status 429;
    limit_conn ex_api_connections 50;
    limit_conn_status 429;
    error_page 429 = @gateway_limited;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location = /admin { return 302 /admin/; }

    location ^~ /admin/ {
        root /opt/surprising-ex/web;
        try_files $uri $uri/ /admin/index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/surprising-admin-headers.conf;
    }

    location = /healthz {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:9094/actuator/health/readiness;
        include /etc/nginx/snippets/surprising-api-proxy.conf;
        access_log off;
    }

    # 做市、行情及生命周期进程通过本机/私网访问内部业务契约。
    location ^~ /api/v1/accounts/ { return 404; }
    location ^~ /api/v1/trading/ { return 404; }
    location ^~ /internal/ { return 404; }

    location ^~ /actuator/ {
        return 404;
    }

    # Public article media has its own authenticated upload and gateway MIME/size checks.
    location = /api/v1/admin/content/media {
        client_max_body_size 68m;
        client_body_timeout 120s;
        proxy_pass http://127.0.0.1:9094;
        include /etc/nginx/snippets/surprising-api-proxy.conf;
    }

    # Twelve rich translations may exceed 1 MiB; all other JSON retains the server default.
    location ~ ^/api/v1/admin/(announcements|legal/revisions)(/[1-9][0-9]*)?$ {
        client_max_body_size 3m;
        proxy_pass http://127.0.0.1:9094;
        include /etc/nginx/snippets/surprising-api-proxy.conf;
    }

    # Private identity and C2C uploads retain their existing independent limits.
    location ~ ^/api/v1/(compliance/kyc/documents|c2c/attachments/[0-9a-fA-F-]+)$ {
        client_max_body_size 20m;
        proxy_pass http://127.0.0.1:9094;
        include /etc/nginx/snippets/surprising-api-proxy.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:9094;
        include /etc/nginx/snippets/surprising-api-proxy.conf;
    }

    location @gateway_limited {
        default_type application/json;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Retry-After 1 always;
        add_header Cache-Control no-store always;
        add_header Access-Control-Allow-Origin $ex_api_cors_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Expose-Headers Retry-After always;
        return 429 '{"code":"RATE_LIMITED","group":"INGRESS","retryAfterSeconds":1}';
    }
}
