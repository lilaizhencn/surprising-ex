surprising:
  market-maker:
    engine:
      quote-interval: 100ms
      trade-interval: 150ms
    quoting:
      order-levels: 50
      order-book-depth: 50
      max-open-orders-per-account-symbol: 100
      min-spread-ticks: 2
      level-spacing-ticks: 1
      max-price-deviation-ppm: 50000
      stale-order-max-age: 30s
      refresh-threshold-ticks: 1
      quantity-variation-ppm: 800000
      order-reconciliation-interval: 0ms
    trade:
      enabled: ${LOCAL_SIMULATED_TRADES_ENABLED:false}
      account-ids: [910001]
      orders-per-batch: 2
      min-quantity-steps: 1
      max-quantity-steps: 10
      inventory-threshold-steps: 100
    strategies:
      - strategy-id: local-btc-usdt-maker
        product-line: LINEAR_PERPETUAL
        enabled: true
        account-ids: [900101]
        base-quantity-steps: 1000
        order-levels: 50
        margin-mode: CROSS
        instrument-ids: ["@BTC-USDT@"]
      - strategy-id: local-eth-usdt-maker
        product-line: LINEAR_PERPETUAL
        enabled: true
        account-ids: [900102]
