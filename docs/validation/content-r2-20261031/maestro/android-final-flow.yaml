appId: com.surprising.surprising_client
---
- extendedWaitUntil:
    visible: Dedicated R2 media
    timeout: 30000
- assertNotVisible: 部分媒体加载失败，可刷新后重试。
- tapOn:
    point: 11%,48%
- extendedWaitUntil:
    visible: 'QA video 0\.0 s; audio [1-9][0-9]*\.[0-9] s'
    timeout: 30000
- takeScreenshot: ${QA_ARTIFACTS}/android-audio-clock
- tapOn:
    point: 11%,48%
- tapOn:
    point: 50%,61%
- extendedWaitUntil:
    visible: 'QA video [1-9][0-9]*\.[0-9] s; audio [0-9]+\.[0-9] s'
    timeout: 30000
- takeScreenshot: ${QA_ARTIFACTS}/android-video-clock
- tapOn: Refresh
- extendedWaitUntil:
    visible: 'QA video 0\.0 s; audio 0\.0 s'
    timeout: 30000
- assertNotVisible: 部分媒体加载失败，可刷新后重试。
- takeScreenshot: ${QA_ARTIFACTS}/android-refresh-clean
- pressKey: Home
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible: 'QA video 0\.0 s; audio 0\.0 s'
    timeout: 30000
- assertNotVisible: 部分媒体加载失败，可刷新后重试。
- takeScreenshot: ${QA_ARTIFACTS}/android-resume-paused
