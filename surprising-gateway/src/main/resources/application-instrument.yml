surprising:
  instrument:
    kafka:
      bootstrap-servers: localhost:9092
      lifecycle-drain-topic: surprising.instrument.lifecycle-drain.v1
      lifecycle-drain-group-id: surprising-instrument-lifecycle-drain-v1
    lifecycle:
      enabled: true
      poll-delay-ms: 1000
      batch-size: 100
    outbox:
      batch-size: 100
      publish-delay-ms: 100
      cleanup-delay-ms: 60000
      send-timeout: 10s
      retention: 7d
      cleanup-batch-size: 500
      cleanup-max-batches: 10
