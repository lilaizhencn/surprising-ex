surprising:
  trade-export:
    enabled: ${TRADE_EXPORT_ENABLED:false}
    cluster-directory: ${TRADE_EXPORT_CLUSTER_DIR:}
    aeron-directory: ${TRADE_EXPORT_AERON_DIR:}
    archive-control-channel: ${TRADE_EXPORT_ARCHIVE_CHANNEL:}
    checkpoint: ${TRADE_EXPORT_CHECKPOINT:}
    cluster-id: ${TRADE_EXPORT_CLUSTER_ID:}
    kafka-config: ${TRADE_EXPORT_KAFKA_CONFIG:}
    checkpoint-interval: 60s
    retry-interval: 5s
  candlestick:
    periods: [ "1m", "5m", "15m", "30m", "1h", "4h", "1d" ]
    kafka:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
      application-id-override: ${SURPRISING_CANDLESTICK_KAFKA_APPLICATION_ID_OVERRIDE:}
    stream:
      threads: 2
      state-dir: ${CANDLESTICK_STATE_DIR:data/kafka-streams}
      commit-interval: 1s
      dedupe-retention: 3d
      dedupe-cleanup-max-entries: 10000
    rocksdb:
      block-cache-size: 256MB
      write-buffer-size: 64MB
      write-buffer-manager-size: 256MB
      max-write-buffer-number: 3
      block-size: 16KB
      max-background-jobs: 2
      target-file-size-base: 64MB
      bytes-per-sync: 1MB
      compression-type: LZ4_COMPRESSION
      bloom-filter-enabled: true
      bloom-filter-bits-per-key: 10.0
    flush:
      interval: 1s
      max-batch-size: 1000
    query:
      max-limit: 1500
  realtime:
    router:
      enabled: ${REALTIME_ENABLED:true}
      directory: ${AERON_DIR:/dev/shm/aeron-router}
      channel: ${REALTIME_ROUTER_CHANNEL:aeron:udp?endpoint=0.0.0.0:21010}
      stream: 2101
      node-stream: 2103
      control-channels: {}
