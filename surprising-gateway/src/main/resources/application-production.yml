spring:
  config:
    activate:
      on-profile: production
  datasource:
    url: ${GATEWAY_DB_URL}
    username: ${GATEWAY_DB_USERNAME}
    password: ${GATEWAY_DB_PASSWORD}

surprising:
  gateway:
    deployment-profile: production
    withdrawal:
      single-approval-threshold-usdt: ${GATEWAY_WITHDRAWAL_SINGLE_APPROVAL_THRESHOLD_USDT}
      daily-limit-usdt: ${GATEWAY_WITHDRAWAL_DAILY_LIMIT_USDT}
      valuation-base-url: ${GATEWAY_WITHDRAWAL_VALUATION_BASE_URL}
      valuation-max-age: ${GATEWAY_WITHDRAWAL_VALUATION_MAX_AGE:30s}
      failure-reconciliation-delay: ${GATEWAY_WITHDRAWAL_FAILURE_RECONCILIATION_DELAY:30s}
    product-transfer:
      verification-threshold-usdt: ${GATEWAY_PRODUCT_TRANSFER_VERIFICATION_THRESHOLD_USDT}
      reconciliation-delay: ${GATEWAY_PRODUCT_TRANSFER_RECONCILIATION_DELAY:5s}
      reconciliation-batch-size: ${GATEWAY_PRODUCT_TRANSFER_RECONCILIATION_BATCH_SIZE:100}
    custody-wallet:
      enabled: ${GATEWAY_CUSTODY_WALLET_ENABLED:true}
      base-url: ${GATEWAY_CUSTODY_WALLET_BASE_URL}
      api-key: ${GATEWAY_CUSTODY_WALLET_API_KEY}
      api-secret: ${GATEWAY_CUSTODY_WALLET_API_SECRET}
      webhook-secret: ${GATEWAY_CUSTODY_WALLET_WEBHOOK_SECRET}
    kyc-documents:
      enabled: ${GATEWAY_KYC_DOCUMENTS_ENABLED:true}
      type: s3
      endpoint: ${GATEWAY_KYC_DOCUMENTS_ENDPOINT}
      bucket: ${GATEWAY_KYC_DOCUMENTS_BUCKET}
      region: ${GATEWAY_KYC_DOCUMENTS_REGION}
      access-key: ${GATEWAY_KYC_DOCUMENTS_ACCESS_KEY}
      secret-key: ${GATEWAY_KYC_DOCUMENTS_SECRET_KEY}
    kyc:
      provider: ${GATEWAY_KYC_PROVIDER:SUMSUB}
      simulation-enabled: false
      sumsub:
        app-token: ${GATEWAY_KYC_SUMSUB_APP_TOKEN:}
        secret-key: ${GATEWAY_KYC_SUMSUB_SECRET_KEY:}
        webhook-secret: ${GATEWAY_KYC_SUMSUB_WEBHOOK_SECRET:}
        level-name: ${GATEWAY_KYC_SUMSUB_LEVEL_NAME:}
        base-url: ${GATEWAY_KYC_SUMSUB_BASE_URL:https://api.sumsub.com}
      veriff:
        api-key: ${GATEWAY_KYC_VERIFF_API_KEY:}
        shared-secret: ${GATEWAY_KYC_VERIFF_SHARED_SECRET:}
        base-url: ${GATEWAY_KYC_VERIFF_BASE_URL:https://stationapi.veriff.com}
        callback-url: ${GATEWAY_KYC_VERIFF_CALLBACK_URL:}
    security:
      require-identity-for-private-routes: true
      admin-ip-allowlist: ${GATEWAY_ADMIN_IP_ALLOWLIST}
      # Test deployment uses Nginx on the same host. Override only when proxy hops are remote.
      trusted-proxy-ip-allowlist: "${GATEWAY_ADMIN_TRUSTED_PROXY_IP_ALLOWLIST:127.0.0.1,::1}"
      require-admin-mfa: true
      phone-registration-enabled: false
      require-email-verification: true
      resend-api-key: ${RESEND_API_KEY}
      resend-from: ${RESEND_FROM}
      resend-base-url: ${RESEND_BASE_URL:https://api.resend.com}
      verification-code-pepper: ${GATEWAY_VERIFICATION_CODE_PEPPER}
      mfa-secret-encryption-key: ${GATEWAY_MFA_SECRET_ENCRYPTION_KEY}
      issuer: ${GATEWAY_JWT_ISSUER:surprising-ex-gateway}
      jwt-secret: ${GATEWAY_JWT_SECRET}
  websocket:
    kafka:
      bootstrap-servers: ${SURPRISING_KAFKA_BOOTSTRAP_SERVERS}
      group-id: ${SURPRISING_WEBSOCKET_GROUP_ID}
    security:
      jwt-secret: ${GATEWAY_JWT_SECRET}
      allowed-origins: ${SURPRISING_WS_ALLOWED_ORIGINS}
