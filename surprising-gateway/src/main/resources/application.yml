server:
  address: ${GATEWAY_BIND_ADDRESS:127.0.0.1}
  port: 9094
  max-http-request-header-size: 16KB
  tomcat:
    connection-timeout: 10s
    keep-alive-timeout: 20s
    max-connections: 4096
    accept-count: 128
    max-http-form-post-size: 1MB
    max-part-count: 8
    max-parameter-count: 128

spring:
  data:
    redis:
      connect-timeout: ${GATEWAY_VALKEY_CONNECT_TIMEOUT:200ms}
      timeout: ${GATEWAY_VALKEY_TIMEOUT:200ms}
  jackson:
    deserialization:
      accept-float-as-int: false
  config:
    import: classpath:application-trading.yml,classpath:application-account.yml,classpath:application-instrument.yml
  application:
    name: surprising-gateway
  servlet:
    multipart:
      max-file-size: ${GATEWAY_MULTIPART_MAX_FILE_SIZE:64MB}
      max-request-size: ${GATEWAY_MULTIPART_MAX_REQUEST_SIZE:68MB}
  main:
    keep-alive: true
  threads:
    virtual:
      enabled: true
  task:
    scheduling:
      pool:
        size: 12
      thread-name-prefix: business-scheduler-
      shutdown:
        await-termination: true
        await-termination-period: 10s
  datasource:
    url: jdbc:postgresql://localhost:5432/surprising_exchange
    username: surprising
    password: surprising
    hikari:
      maximum-pool-size: ${BUSINESS_DB_MAX_POOL_SIZE:30}
      minimum-idle: ${BUSINESS_DB_MIN_IDLE:4}
      connection-timeout: 3000
management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,markPriceReadiness,gatewayProducts
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

surprising:
  content:
    r2:
      enabled: ${GATEWAY_CONTENT_R2_ENABLED:false}
      endpoint: ${GATEWAY_CONTENT_R2_ENDPOINT:}
      access-key-id: ${GATEWAY_CONTENT_R2_ACCESS_KEY_ID:}
      secret-access-key: ${GATEWAY_CONTENT_R2_SECRET_ACCESS_KEY:}
      bucket: ${GATEWAY_CONTENT_R2_BUCKET:surprising-ex-public}
      public-base-url: ${GATEWAY_CONTENT_R2_PUBLIC_BASE_URL:https://ex-cdn.tokdou.com}
  c2c:
    enabled: ${C2C_ENABLED:false}
    r2:
      enabled: ${C2C_R2_ENABLED:false}
      type: ${C2C_R2_TYPE:s3}
      endpoint: ${C2C_R2_ENDPOINT:}
      account-id: ${C2C_R2_ACCOUNT_ID:}
      access-key-id: ${C2C_R2_ACCESS_KEY_ID:}
      secret-access-key: ${C2C_R2_SECRET_ACCESS_KEY:}
      bucket: ${C2C_R2_BUCKET:app-private}
      region: ${C2C_R2_REGION:us-east-1}
      prefix: ${C2C_R2_PREFIX:private/trading/c2c/}
      presigned-url-expiry-seconds: ${C2C_R2_PRESIGNED_URL_EXPIRY_SECONDS:300}
      root-path: ${C2C_R2_ROOT_PATH:/tmp/surprising-c2c-attachments}
  gateway:
    products:
      cores:
        SPOT:
          hostnames: ${GATEWAY_CORE_SPOT_HOSTNAMES:${AERON_CLUSTER_HOSTNAMES:localhost}}
          egress-hostname: ${GATEWAY_CORE_SPOT_EGRESS_HOSTNAME:${AERON_EGRESS_HOSTNAME:localhost}}
          response-timeout: ${GATEWAY_CORE_SPOT_RESPONSE_TIMEOUT:${AERON_RESPONSE_TIMEOUT:5s}}
          client-connections: ${GATEWAY_CORE_SPOT_CLIENT_CONNECTIONS:${AERON_CLIENT_CONNECTIONS:4}}
        LINEAR_PERPETUAL:
          hostnames: ${GATEWAY_CORE_LINEAR_PERPETUAL_HOSTNAMES:${AERON_CLUSTER_HOSTNAMES:localhost}}
          egress-hostname: ${GATEWAY_CORE_LINEAR_PERPETUAL_EGRESS_HOSTNAME:${AERON_EGRESS_HOSTNAME:localhost}}
          response-timeout: ${GATEWAY_CORE_LINEAR_PERPETUAL_RESPONSE_TIMEOUT:${AERON_RESPONSE_TIMEOUT:5s}}
          client-connections: ${GATEWAY_CORE_LINEAR_PERPETUAL_CLIENT_CONNECTIONS:${AERON_CLIENT_CONNECTIONS:4}}
        INVERSE_PERPETUAL:
          hostnames: ${GATEWAY_CORE_INVERSE_PERPETUAL_HOSTNAMES:${AERON_CLUSTER_HOSTNAMES:localhost}}
          egress-hostname: ${GATEWAY_CORE_INVERSE_PERPETUAL_EGRESS_HOSTNAME:${AERON_EGRESS_HOSTNAME:localhost}}
          response-timeout: ${GATEWAY_CORE_INVERSE_PERPETUAL_RESPONSE_TIMEOUT:${AERON_RESPONSE_TIMEOUT:5s}}
          client-connections: ${GATEWAY_CORE_INVERSE_PERPETUAL_CLIENT_CONNECTIONS:${AERON_CLIENT_CONNECTIONS:4}}
        LINEAR_DELIVERY:
          hostnames: ${GATEWAY_CORE_LINEAR_DELIVERY_HOSTNAMES:${AERON_CLUSTER_HOSTNAMES:localhost}}
          egress-hostname: ${GATEWAY_CORE_LINEAR_DELIVERY_EGRESS_HOSTNAME:${AERON_EGRESS_HOSTNAME:localhost}}
          response-timeout: ${GATEWAY_CORE_LINEAR_DELIVERY_RESPONSE_TIMEOUT:${AERON_RESPONSE_TIMEOUT:5s}}
          client-connections: ${GATEWAY_CORE_LINEAR_DELIVERY_CLIENT_CONNECTIONS:${AERON_CLIENT_CONNECTIONS:4}}
        INVERSE_DELIVERY:
          hostnames: ${GATEWAY_CORE_INVERSE_DELIVERY_HOSTNAMES:${AERON_CLUSTER_HOSTNAMES:localhost}}
          egress-hostname: ${GATEWAY_CORE_INVERSE_DELIVERY_EGRESS_HOSTNAME:${AERON_EGRESS_HOSTNAME:localhost}}
          response-timeout: ${GATEWAY_CORE_INVERSE_DELIVERY_RESPONSE_TIMEOUT:${AERON_RESPONSE_TIMEOUT:5s}}
          client-connections: ${GATEWAY_CORE_INVERSE_DELIVERY_CLIENT_CONNECTIONS:${AERON_CLIENT_CONNECTIONS:4}}
        OPTION:
          hostnames: ${GATEWAY_CORE_OPTION_HOSTNAMES:${AERON_CLUSTER_HOSTNAMES:localhost}}
          egress-hostname: ${GATEWAY_CORE_OPTION_EGRESS_HOSTNAME:${AERON_EGRESS_HOSTNAME:localhost}}
          response-timeout: ${GATEWAY_CORE_OPTION_RESPONSE_TIMEOUT:${AERON_RESPONSE_TIMEOUT:5s}}
          client-connections: ${GATEWAY_CORE_OPTION_CLIENT_CONNECTIONS:${AERON_CLIENT_CONNECTIONS:4}}
