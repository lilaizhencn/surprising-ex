server:
  address: 127.0.0.1
  port: 9094
  max-http-request-header-size: 16KB
  tomcat:
    connection-timeout: 10s
    keep-alive-timeout: 20s
    max-connections: 4096
    accept-count: 128
    max-http-form-post-size: 1MB
    max-part-count: 8
    max-parameter-count: 128

spring:
  kafka:
    bootstrap-servers: localhost:9092
  data:
    redis:
      connect-timeout: 200ms
      timeout: 200ms
  jackson:
    deserialization:
      accept-float-as-int: false
      use-big-decimal-for-floats: true
  application:
    name: surprising-gateway
  servlet:
    multipart:
      max-file-size: 64MB
      max-request-size: 68MB
  main:
    keep-alive: true
  threads:
    virtual:
      enabled: true
  task:
    scheduling:
      pool:
        size: 12
      thread-name-prefix: business-scheduler-
      shutdown:
        await-termination: true
        await-termination-period: 10s
  datasource:
    url: jdbc:postgresql://localhost:5432/surprising_exchange
    username: surprising
    password: surprising
    hikari:
      maximum-pool-size: 30
      minimum-idle: 4
      connection-timeout: 3000
management:
  endpoint:
    health:
      show-details: always
      show-components: always
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,markPriceReadiness,gatewayProducts
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.9, 0.95, 0.99, 0.999
      slo:
        http.server.requests: 10ms, 50ms, 100ms, 200ms, 500ms, 1s, 2s

surprising:
  content:
    r2:
      enabled: false
      endpoint: ""
      access-key-id: ""
      secret-access-key: ""
      bucket: surprising-ex-public
      public-base-url: https://ex-cdn.tokdou.com
  c2c:
    enabled: false
    r2:
      enabled: false
      type: s3
      endpoint: ""
      account-id: ""
      access-key-id: ""
      secret-access-key: ""
      bucket: app-private
      region: us-east-1
      prefix: private/trading/c2c/
      presigned-url-expiry-seconds: 300
      root-path: /tmp/surprising-c2c-attachments
  gateway:
    products:
      default-core:
        hostnames: localhost
        egress-hostname: localhost
        response-timeout: 5s
        client-connections: 4
    withdrawal:
      single-approval-threshold-usdt: 10000
      daily-limit-usdt: 50000
      valuation-max-age: 30s
      failure-reconciliation-delay: 30s
    product-transfer:
      verification-threshold-usdt: 10000
      reconciliation-delay: 5s
      reconciliation-batch-size: 100
    custody-wallet:
      enabled: false
      base-url: http://localhost:8002
      api-key: ""
      api-secret: ""
      webhook-secret: ""
      request-timeout: 10s
    kyc-documents:
      enabled: false
      type: s3
      endpoint: ""
      bucket: ""
      region: us-east-1
      access-key: ""
      secret-key: ""
      root-path: /tmp/surprising-kyc-documents
      prefix: kyc
      max-file-size-bytes: 15728640
    kyc:
      provider: SUMSUB
      validity: 365d
      simulation-enabled: true
      sumsub:
        app-token: ""
        secret-key: ""
        webhook-secret: ""
        level-names:
          INDIVIDUAL_BASIC: basic-kyc-level
          INDIVIDUAL_STANDARD: ""
          INDIVIDUAL_ENHANCED: ""
          BUSINESS_BASIC: ""
          BUSINESS_STANDARD: ""
          BUSINESS_ENHANCED: ""
        base-url: https://api.sumsub.com
      veriff:
        kyc-level: BASIC
        api-key: ""
        shared-secret: ""
        base-url: https://stationapi.veriff.com
        callback-url: ""
    binance-api:
      enabled: true
      symbol-aliases: {}
      symbol-scales: {}
    security:
      admin-browser-allowed-origins: http://localhost:5174,http://127.0.0.1:5174,http://localhost:5176,http://127.0.0.1:5176,https://ex-api.tokdou.com
      phone-registration-enabled: false
      require-email-verification: false
      resend-api-key: ""
      resend-from: ""
      resend-base-url: https://api.resend.com
      verification-code-pepper: local-dev-verification-pepper-change-me
      simulated-verification-codes-enabled: false
      verification-code-ttl: 10m
      mfa-secret-encryption-key: ""
      jwt-secret: local-dev-change-me-surprising-ex-gateway-secret-2026
      session-ttl: 7d
      admin-session-ttl: 8h
      browser-cookie-secure: true
      browser-cookie-domain: ""
    http-client:
      connect-timeout: 1s
      read-timeout: 30s
    routes:
      market-maker:
        base-url: http://localhost:9096
        target-prefix: /api/v1/market-maker
        private-route: true
    admin-routes:
      market-maker:
        base-url: http://localhost:9096
        target-prefix: /api/v1/admin/market-maker
        private-route: true
  websocket:
    kafka:
      # 合并部署后每个实例组名随主机名固定，避免每次重启产生随机孤儿 Consumer Group。
      group-id: surprising-websocket-${HOSTNAME:local}
    security:
      allowed-origins:
        - "http://localhost:*"
        - "http://127.0.0.1:*"
        - "https://ex.tokdou.com"
        - "https://ex-api.tokdou.com"
    netty:
      enabled: true
      port: 8081

  account:
    aeron:
      source-identity: account-node
  trading:
    order:
      aeron:
        node-id: 0
      risk:
        limit-price-protection-enabled: true
        limit-price-max-mark-age-ms: 15000
    trigger:
      execution:
        max-trigger-scan-pages: 16
  price:
    consumer:
      max-age: 5s
    index:
      http:
        proxy-enabled: false
        proxy-host: 127.0.0.1
        proxy-port: 7897
    mark:
      market-channel: "aeron:udp?endpoint=127.0.0.1:21407"
  candlestick:
    kafka:
      application-id-override: ""
    stream:
      threads: 1
      state-dir: data/kafka-streams
  realtime:
    router:
      enabled: true
      directory: ${SURPRISING_REALTIME_DIRECTORY:/dev/shm/aeron-router}
      channel: "aeron:udp?endpoint=0.0.0.0:21010"

telegram:
  login:
    client-id: ""
    client-secret: ""
    redirect-uri: ""
  bot:
    token: ""
    username: leelz_openClaw_bot
    webhook-url: ""
    webhook-secret: ""
    webapp-url: https://app.surprising.exchange
    alert-chat-id: ""

