    kafka:
      bootstrap-servers: ${SURPRISING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
      # 合并部署后仍要求每个 Gateway 实例使用唯一 consumer group，确保公共行情在每个节点本地 fanout。
      group-id: ${SURPRISING_WEBSOCKET_GROUP_ID:surprising-websocket-${HOSTNAME:${random.uuid}}}
      concurrency: 2
      max-poll-records: 1000
    session:
      max-subscriptions: 200
      outbound-queue-capacity: 1000
      send-timeout: 5s
    security:
      authorization-workers: 4
      authorization-queue-capacity: 256
      allowed-origins:
        - ${SURPRISING_WS_ALLOWED_ORIGIN:*}
    fanout:
      candle-partial-coalesce-window: 250ms
      mark-price-max-age: 3s
      mark-price-allowed-future-skew: 1s

