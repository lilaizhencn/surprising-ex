      single-approval-threshold-usdt: ${GATEWAY_WITHDRAWAL_SINGLE_APPROVAL_THRESHOLD_USDT:10000}
      daily-limit-usdt: ${GATEWAY_WITHDRAWAL_DAILY_LIMIT_USDT:50000}
      valuation-base-url: ${GATEWAY_WITHDRAWAL_VALUATION_BASE_URL:http://localhost:9082}
      valuation-max-age: ${GATEWAY_WITHDRAWAL_VALUATION_MAX_AGE:30s}
      failure-reconciliation-delay: ${GATEWAY_WITHDRAWAL_FAILURE_RECONCILIATION_DELAY:30s}
    product-transfer:
      verification-threshold-usdt: ${GATEWAY_PRODUCT_TRANSFER_VERIFICATION_THRESHOLD_USDT:10000}
      reconciliation-delay: ${GATEWAY_PRODUCT_TRANSFER_RECONCILIATION_DELAY:5s}
      reconciliation-batch-size: ${GATEWAY_PRODUCT_TRANSFER_RECONCILIATION_BATCH_SIZE:100}
