server:
  port: ${REALTIME_ROUTER_PORT:9095}

spring:
  lifecycle:
    timeout-per-shutdown-phase: 120s
  cloud:
    openfeign:
      client:
        config:
          default:
            defaultRequestHeaders:
              X-Business-Internal-Token: ${BUSINESS_INTERNAL_TOKEN:}
  application:
    name: surprising-realtime-market-data
  task:
    scheduling:
      pool:
        size: 2
      thread-name-prefix: market-data-
      shutdown:
        await-termination: true
        await-termination-period: 10s
  datasource:
    url: jdbc:postgresql://localhost:5432/surprising_exchange?reWriteBatchedInserts=true
    username: surprising
    password: surprising
    hikari:
      maximum-pool-size: 20
      minimum-idle: 4
      connection-timeout: 3000
      validation-timeout: 1000

  data:
    redis:
      host: ${VALKEY_HOST:127.0.0.1}
      port: ${VALKEY_PORT:6379}
      username: ${VALKEY_USERNAME:default}
      password: ${VALKEY_PASSWORD:}
      connect-timeout: 500ms
      timeout: 500ms
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

surprising:
  trade-export:
    enabled: ${TRADE_EXPORT_ENABLED:false}
    cluster-directory: ${TRADE_EXPORT_CLUSTER_DIR:}
    aeron-directory: ${TRADE_EXPORT_AERON_DIR:}
    archive-control-channel: ${TRADE_EXPORT_ARCHIVE_CHANNEL:}
    checkpoint: ${TRADE_EXPORT_CHECKPOINT:}
    cluster-id: ${TRADE_EXPORT_CLUSTER_ID:}
    kafka-config: ${TRADE_EXPORT_KAFKA_CONFIG:}
    checkpoint-interval: 60s
    retry-interval: 5s
  candlestick:
    periods: [ "1m", "5m", "15m", "30m", "1h", "4h", "1d" ]
    kafka:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
      product-line: ${PRODUCT_LINE:LINEAR_PERPETUAL}
      application-id-override: ${SURPRISING_CANDLESTICK_KAFKA_APPLICATION_ID_OVERRIDE:}
    stream:
      threads: 2
      state-dir: ${CANDLESTICK_STATE_DIR:data/kafka-streams}
      commit-interval: 1s
      dedupe-retention: 3d
      dedupe-cleanup-max-entries: 10000
    rocksdb:
      block-cache-size: 256MB
      write-buffer-size: 64MB
      write-buffer-manager-size: 256MB
      max-write-buffer-number: 3
      block-size: 16KB
      max-background-jobs: 2
      target-file-size-base: 64MB
      bytes-per-sync: 1MB
      compression-type: LZ4_COMPRESSION
      bloom-filter-enabled: true
      bloom-filter-bits-per-key: 10.0
    flush:
      interval: 1s
      max-batch-size: 1000
    query:
      max-limit: 1500
  realtime:
    router:
      enabled: ${REALTIME_ENABLED:true}
      directory: ${AERON_DIR:/dev/shm/aeron-router}
      channel: ${REALTIME_ROUTER_CHANNEL:aeron:udp?endpoint=0.0.0.0:21010}
      stream: 2101
      node-stream: 2103
      # Explicit per-product control destinations are required; see module README.
      control-channels: {}
