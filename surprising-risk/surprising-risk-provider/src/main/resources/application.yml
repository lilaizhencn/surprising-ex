server:
  port: 9087

spring:
  application:
    name: surprising-risk-provider
  datasource:
    url: jdbc:postgresql://localhost:5432/surprising_exchange
    username: surprising
    password: surprising
    hikari:
      maximum-pool-size: 20
      minimum-idle: 4
      connection-timeout: 3000
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

surprising:
  risk:
    product-line: ${PRODUCT_LINE:LINEAR_PERPETUAL}
    aeron:
      hostnames: ${AERON_CLUSTER_HOSTNAMES:localhost,localhost,localhost}
      egress-hostname: ${AERON_EGRESS_HOSTNAME:localhost}
      response-timeout: ${AERON_RESPONSE_TIMEOUT:5s}
      client-connections: ${AERON_CLIENT_CONNECTIONS:2}
    calculation:
      scan-delay-ms: 1000
      max-mark-age: 10s
      scan-batch-size: 500
