spring:
  cloud:
    openfeign:
      circuitbreaker:
        enabled: false

surprising:
  market-maker:
    engine:
      enabled: true
      quote-watchdog-interval: 100ms
      trade-interval: 100ms
    quoting:
      order-book-depth: 100
      order-levels: 30
      min-spread-ticks: 2
      level-spacing-ticks: 1
      refresh-threshold-ticks: 3
      refresh-tolerance-ppm: 50
      quantity-refresh-tolerance-ppm: 150000
      quantity-variation-ppm: 500000
      reference-pressure-skew-ppm: 150
      inventory-price-skew-ppm: 0
      order-reconciliation-interval: 50ms
      max-open-orders-per-account-symbol: 200
    trade:
      enabled: true
      account-ids: []
      orders-per-batch: 1
      min-quantity-steps: 1
      # A copied print is still capped by the top of our own book, so one external trade cannot clear it.
      max-quantity-steps: 1000000
      slippage-ticks: 10
      max-sweep-levels: 2
    reference-market:
      enabled: true
      web-socket-enabled: true
      refresh-interval: 100ms
      # Keep the external size. The old 1_000-step ceiling turned a 5-coin level into 10 at most,
      # and the strategy base of 3 steps then flattened every level to 0.03.
      max-quantity-steps: 10000000000
      sources:
        - name: okx-btc
          enabled: true
          product-line: LINEAR_PERPETUAL
          instrument-id: "604"
          external-symbol: BTC-USDT-SWAP
          url: https://www.okx.com/api/v5/market/books?instId=BTC-USDT-SWAP&sz=20
          parser: OKX_BOOKS
          web-socket-url: wss://ws.okx.com:8443/ws/v5/public
          web-socket-subscribe-message: '{"op":"subscribe","args":[{"channel":"books","instId":"BTC-USDT-SWAP"}]}'
          web-socket-parser: OKX_BOOKS_WS
        - name: okx-eth
          enabled: true
          product-line: LINEAR_PERPETUAL
          instrument-id: "653"
          external-symbol: ETH-USDT-SWAP
          url: https://www.okx.com/api/v5/market/books?instId=ETH-USDT-SWAP&sz=20
          parser: OKX_BOOKS
          web-socket-url: wss://ws.okx.com:8443/ws/v5/public
          web-socket-subscribe-message: '{"op":"subscribe","args":[{"channel":"books","instId":"ETH-USDT-SWAP"}]}'
          web-socket-parser: OKX_BOOKS_WS
        - name: okx-sol
          enabled: true
          product-line: LINEAR_PERPETUAL
          instrument-id: "866"
          external-symbol: SOL-USDT-SWAP
          url: https://www.okx.com/api/v5/market/books?instId=SOL-USDT-SWAP&sz=20
          parser: OKX_BOOKS
          web-socket-url: wss://ws.okx.com:8443/ws/v5/public
          web-socket-subscribe-message: '{"op":"subscribe","args":[{"channel":"books","instId":"SOL-USDT-SWAP"}]}'
          web-socket-parser: OKX_BOOKS_WS
        - name: okx-spot-btc
          enabled: true
          product-line: SPOT
          instrument-id: "1001"
          external-symbol: BTC-USDT
          url: https://www.okx.com/api/v5/market/books?instId=BTC-USDT&sz=20
          parser: OKX_BOOKS
          web-socket-url: wss://ws.okx.com:8443/ws/v5/public
          web-socket-subscribe-message: '{"op":"subscribe","args":[{"channel":"books","instId":"BTC-USDT"}]}'
          web-socket-parser: OKX_BOOKS_WS
        - name: okx-spot-eth
          enabled: true
          product-line: SPOT
          instrument-id: "1002"
          external-symbol: ETH-USDT
          url: https://www.okx.com/api/v5/market/books?instId=ETH-USDT&sz=20
          parser: OKX_BOOKS
          web-socket-url: wss://ws.okx.com:8443/ws/v5/public
          web-socket-subscribe-message: '{"op":"subscribe","args":[{"channel":"books","instId":"ETH-USDT"}]}'
          web-socket-parser: OKX_BOOKS_WS
        - name: okx-spot-sol
          enabled: true
          product-line: SPOT
          instrument-id: "1003"
          external-symbol: SOL-USDT
          url: https://www.okx.com/api/v5/market/books?instId=SOL-USDT&sz=20
          parser: OKX_BOOKS
          web-socket-url: wss://ws.okx.com:8443/ws/v5/public
          web-socket-subscribe-message: '{"op":"subscribe","args":[{"channel":"books","instId":"SOL-USDT"}]}'
          web-socket-parser: OKX_BOOKS_WS
    strategies:
      - strategy-id: local-perp-btc
        product-line: LINEAR_PERPETUAL
        enabled: true
        account-ids: [101]
        instrument-ids: ["604"]
        base-quantity-steps: 3
        margin-mode: CROSS
        spread-ticks: 1
        level-spacing-ticks: 1
        order-levels: 30
        max-inventory-steps: 10000
        max-inventory-skew-ppm: 500000
      - strategy-id: local-perp-eth
        product-line: LINEAR_PERPETUAL
        enabled: true
        account-ids: [102]
        instrument-ids: ["653"]
        base-quantity-steps: 3
        margin-mode: CROSS
        spread-ticks: 1
        level-spacing-ticks: 1
        order-levels: 30
        max-inventory-steps: 10000
        max-inventory-skew-ppm: 500000
      - strategy-id: local-perp-sol
        product-line: LINEAR_PERPETUAL
        enabled: true
        account-ids: [103]
        instrument-ids: ["866"]
        base-quantity-steps: 3
        margin-mode: CROSS
        spread-ticks: 1
        level-spacing-ticks: 1
        order-levels: 30
        max-inventory-steps: 10000
        max-inventory-skew-ppm: 500000
      - strategy-id: local-spot-btc
        product-line: SPOT
        enabled: true
        account-ids: [201]
        instrument-ids: ["1001"]
        base-quantity-steps: 3
        margin-mode: CROSS
        spread-ticks: 1
        level-spacing-ticks: 1
        order-levels: 30
        max-inventory-steps: 10000
        max-inventory-skew-ppm: 500000
      - strategy-id: local-spot-eth
        product-line: SPOT
        enabled: true
        account-ids: [202]
        instrument-ids: ["1002"]
        base-quantity-steps: 3
        margin-mode: CROSS
        spread-ticks: 1
        level-spacing-ticks: 1
        order-levels: 30
        max-inventory-steps: 10000
        max-inventory-skew-ppm: 500000
      - strategy-id: local-spot-sol
        product-line: SPOT
        enabled: true
        account-ids: [203]
        instrument-ids: ["1003"]
        base-quantity-steps: 3
        margin-mode: CROSS
        spread-ticks: 1
        level-spacing-ticks: 1
        order-levels: 30
