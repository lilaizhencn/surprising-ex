server:
  port: 9096

spring:
  jackson:
    deserialization:
      accept-float-as-int: false
  application:
    name: surprising-maker
  task:
    scheduling:
      pool:
        size: 2
      thread-name-prefix: market-maker-scheduler-
      shutdown:
        await-termination: true
        await-termination-period: 10s
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.9, 0.95, 0.99, 0.999
      slo:
        http.server.requests: 10ms, 50ms, 100ms, 200ms, 500ms, 1s, 2s

surprising:
  realtime:
    enabled: true
    directory: /dev/shm/aeron-surprising
    channel: "aeron:udp?endpoint=127.0.0.1:40130"
    stream: 2103
  market-maker:
    infrastructure:
      product-line: LINEAR_PERPETUAL
      node-id: ""
    # 单实例；业务配置与策略由 YAML 初始化，后台热更新只保留在当前进程。
    engine:
      enabled: true
      trade-interval: 1s
    reference-market:
      enabled: true
      max-age: 5s
      request-timeout: 5s
      reconnect-backoff: 2s
      depth-levels: 20
      sources: []
    strategies: []
