server:
  port: 9096

spring:
  jackson:
    deserialization:
      accept-float-as-int: false
  application:
    name: surprising-maker
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          default:
            # 做市报价是异步用户命令链路，读超时要覆盖 Kafka 重平衡和账户预占确认。
            connect-timeout: 2000
            read-timeout: 5000
resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 20
        minimumNumberOfCalls: 5
        failureRateThreshold: 50.0
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        slowCallRateThreshold: 70.0
        slowCallDurationThreshold: 3s
  timelimiter:
    configs:
      default:
        timeoutDuration: 5s
  task:
    scheduling:
      pool:
        size: 4
      thread-name-prefix: market-maker-scheduler-
      shutdown:
        await-termination: true
        await-termination-period: 10s
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

surprising:
  price:
    consumer:
      bootstrap-servers: localhost:9092
      product-line: ${PRODUCT_LINE}
      group-id: surprising-market-maker-mark-price-${HOSTNAME:${random.uuid}}
      max-age: 3s
      allowed-future-skew: 1s
      concurrency: ${PRICE_CONSUMER_CONCURRENCY:1}
      max-poll-records: 500
      required-instrument-ids: ${PRICE_CONSUMER_REQUIRED_INSTRUMENT_IDS:}
  clients:
    gateway:
      name: ${SURPRISING_GATEWAY_NAME:surprising-gateway}
      url: ${SURPRISING_GATEWAY_URL:}
    account:
      base-url: ${SURPRISING_ACCOUNT_URL:${SURPRISING_GATEWAY_URL:http://localhost:9094}}
    instrument:
      base-url: ${SURPRISING_INSTRUMENT_URL:${SURPRISING_GATEWAY_URL:http://localhost:9094}}
    matching:
      base-url: ${SURPRISING_MATCHING_URL:${SURPRISING_GATEWAY_URL:http://localhost:9094}}
    trading:
      base-url: ${SURPRISING_TRADING_URL:${SURPRISING_GATEWAY_URL:http://localhost:9094}}
  market-maker:
    infrastructure:
      product-line: ${PRODUCT_LINE}
      node-id: ${MM_NODE_ID:}
      kafka:
        bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
        instrument-snapshot-group-id: surprising-market-maker-instrument-snapshot-v1
    # 单实例；业务配置与策略由 YAML 初始化，后台热更新只保留在当前进程。
    engine:
      enabled: ${MM_ENGINE_ENABLED:false}
      trade-interval: ${MM_TRADE_INTERVAL:1s}
    reference-market:
      enabled: ${REFERENCE_MARKET_ENABLED:false}
      max-age: 3s
      request-timeout: 2s
      reconnect-backoff: 5s
      depth-levels: 20
      sources: []
    strategies: []
