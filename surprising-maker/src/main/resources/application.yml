server:
  port: 9096

spring:
  application:
    name: surprising-maker
  cloud:
    openfeign:
      client:
        config:
          default:
            # 做市报价是异步用户命令链路，读超时要覆盖 Kafka 重平衡和账户预占确认。
            connect-timeout: 1000
            read-timeout: 5000
  task:
    scheduling:
      pool:
        size: 4
      thread-name-prefix: market-maker-scheduler-
      shutdown:
        await-termination: true
        await-termination-period: 10s
  datasource:
    url: jdbc:postgresql://localhost:5432/surprising_exchange
    username: surprising
    password: surprising
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

surprising:
  price:
    consumer:
      bootstrap-servers: localhost:9092
      product-line: ${PRODUCT_LINE}
      group-id: surprising-market-maker-mark-price-${HOSTNAME:${random.uuid}}
      max-age: 3s
      allowed-future-skew: 1s
      concurrency: ${PRICE_CONSUMER_CONCURRENCY:8}
      max-poll-records: 500
      required-instrument-ids: ${PRICE_CONSUMER_REQUIRED_INSTRUMENT_IDS:}
  clients:
    account:
      base-url: http://localhost:9094
    instrument:
      base-url: http://localhost:9094
    matching:
      base-url: http://localhost:9094
    trading:
      base-url: http://localhost:9094
  market-maker:
    infrastructure:
      product-line: ${PRODUCT_LINE}
      node-id: ${MM_NODE_ID:}
      kafka:
        bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
        instrument-snapshot-group-id: surprising-market-maker-instrument-snapshot-v1
      coordination:
        enabled: true
        lease-duration: 5s
