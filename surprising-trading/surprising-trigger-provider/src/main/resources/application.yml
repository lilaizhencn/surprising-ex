server:
  port: 9095

spring:
  application:
    name: surprising-trigger-provider
  task:
    scheduling:
      pool:
        size: 2
      thread-name-prefix: trigger-scheduler-
      shutdown:
        await-termination: true
        await-termination-period: 10s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

surprising:
  trading:
    trigger:
      product-line: ${PRODUCT_LINE}
      execution:
        trigger-batch-size: 200
        max-trigger-scan-pages: ${TRIGGER_MAX_SCAN_PAGES:16}
        stale-triggering-after: 30s
        maintenance-delay-ms: 1000
