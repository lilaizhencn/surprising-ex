server:
  port: 9084

spring:
  application:
    name: surprising-order-provider
  task:
    scheduling:
      pool:
        size: 6
      thread-name-prefix: order-scheduler-
      shutdown:
        await-termination: true
        await-termination-period: 10s
  datasource:
    url: jdbc:postgresql://localhost:5432/surprising_exchange
    username: surprising
    password: surprising
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5
      connection-timeout: 3000
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,markPriceReadiness

surprising:
  price:
    consumer:
      bootstrap-servers: localhost:9092
      product-line: ${PRODUCT_LINE}
      product-topics-enabled: ${PRODUCT_TOPICS_ENABLED}
      topic: surprising.perp.mark.price.v1
      group-id: surprising-order-mark-price-${HOSTNAME:${random.uuid}}
      max-age: 15s
      allowed-future-skew: 1s
      concurrency: 1
      max-poll-records: 500
  clients:
    trigger:
      base-url: http://localhost:9095
  trading:
    order:
      kafka:
        bootstrap-servers: localhost:9092
        product-line: ${PRODUCT_LINE}
        product-topics-enabled: ${PRODUCT_TOPICS_ENABLED}
        # 用户命令按用户键分区；每个分区独占消费者，避免做市流量阻塞普通用户的命令结果。
        account-command-results-concurrency: ${ORDER_ACCOUNT_COMMAND_RESULTS_CONCURRENCY:32}
        user-command-concurrency: ${ORDER_USER_COMMAND_CONCURRENCY:32}
        # 用户命令包含 Kafka 发送和单写者落盘，等待时间必须覆盖启动重平衡窗口。
        user-command-timeout: ${ORDER_USER_COMMAND_TIMEOUT:15s}
        result-cache-ttl: ${ORDER_COMMAND_RESULT_CACHE_TTL:5m}
        result-cache-max-entries: ${ORDER_COMMAND_RESULT_CACHE_MAX_ENTRIES:10000}
        order-commands-topic: surprising.perp.order.commands.v1
        order-events-topic: surprising.perp.order.events.v1
        instrument-lifecycle-drain-topic: surprising.instrument.lifecycle-drain.v1
        open-interest-events-topic: surprising.account.open-interest.events.v1
        account-state-events-topic: surprising.account.state.events.v1
      redis-index:
        key-prefix: surprising:order:v1
        reconcile-delay-ms: 10000
        rebuild-batch-size: 1000
        rebuild-max-age: 5m
        ready-ttl: 30s
        lock-ttl: 30s
      wal:
        directory: ${ORDER_WAL_DIR:data/order-wal}
        node-id: ${ORDER_WAL_NODE_ID}
        worker-delay-ms: ${ORDER_WAL_WORKER_DELAY_MS:25}
      aeron:
        hostnames: ${AERON_CLUSTER_HOSTNAMES:localhost,localhost,localhost}
        egress-hostname: ${AERON_EGRESS_HOSTNAME:localhost}
        response-timeout: ${AERON_RESPONSE_TIMEOUT:5s}
        client-connections: ${AERON_CLIENT_CONNECTIONS:4}
    event-publish:
      send-timeout: 3s
      risk:
        market-max-slippage-ppm: 10000
        market-max-mark-age-ms: 5000
        limit-price-protection-enabled: true
        limit-price-band-ppm: 50000
        limit-price-max-mark-age-ms: 15000
      algo:
        enabled: true
        claim-batch-size: 100
        scan-delay-ms: 250
        min-interval-seconds: 1
        max-interval-seconds: 86400
        min-duration-seconds: 5
        max-duration-seconds: 86400
