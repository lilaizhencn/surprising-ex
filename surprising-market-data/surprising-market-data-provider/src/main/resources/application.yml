server:
  port: ${MARKET_DATA_PORT:9081}

spring:
  application:
    name: surprising-market-data-provider
  task:
    scheduling:
      pool:
        size: 2
      thread-name-prefix: market-data-
      shutdown:
        await-termination: true
        await-termination-period: 10s
  datasource:
    url: jdbc:postgresql://localhost:5432/surprising_exchange?reWriteBatchedInserts=true
    username: surprising
    password: surprising
    hikari:
      maximum-pool-size: 20
      minimum-idle: 4
      connection-timeout: 3000
      validation-timeout: 1000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

surprising:
  candlestick:
    periods: [ "1m", "5m", "15m", "30m", "1h", "4h", "1d" ]
    kafka:
      bootstrap-servers: localhost:9092
      product-line: ${PRODUCT_LINE}
      trade-topic: surprising.perp.match.trades.v1
      candle-topic: surprising.perp.candle.events.v1
      application-id: surprising-candlestick-v1
      application-id-override: ${SURPRISING_CANDLESTICK_KAFKA_APPLICATION_ID_OVERRIDE:}
    stream:
      threads: 2
      state-dir: data/kafka-streams
      commit-interval: 1s
      dedupe-retention: 3d
      dedupe-cleanup-max-entries: 10000
    rocksdb:
      block-cache-size: 256MB
      write-buffer-size: 64MB
      write-buffer-manager-size: 256MB
      max-write-buffer-number: 3
      block-size: 16KB
      max-background-jobs: 2
      target-file-size-base: 64MB
      bytes-per-sync: 1MB
      compression-type: LZ4_COMPRESSION
      bloom-filter-enabled: true
      bloom-filter-bits-per-key: 10.0
    flush:
      interval: 1s
      max-batch-size: 1000
    query:
      max-limit: 1500
  trading:
    matching:
      aeron:
        hostnames: ${AERON_CLUSTER_HOSTNAMES:localhost,localhost,localhost}
        egress-hostname: ${AERON_EGRESS_HOSTNAME:localhost}
        response-timeout: ${AERON_RESPONSE_TIMEOUT:5s}
        bootstrap-timeout: ${AERON_BOOTSTRAP_TIMEOUT:45s}
      kafka:
        bootstrap-servers: localhost:9092
        product-line: ${PRODUCT_LINE}
        group-id: surprising-matching-market-data-v1
        client-id: surprising-matching-market-data-${HOSTNAME:${random.uuid}}
        core-events-topic: ${CORE_EVENTS_TOPIC:}
        match-trades-topic: surprising.perp.match.trades.v1
        order-book-depth-topic: surprising.perp.orderbook.depth.v1
        max-poll-records: ${MATCHING_MAX_POLL_RECORDS:1024}
      market-data:
        enabled: true
        depth-levels: 30
        batch-size: 512
        max-in-flight: 256
        publish-delay-ms: 5
        max-block-ms: 5
        delivery-timeout-ms: 500
        request-timeout-ms: 300
        linger-ms: 10
        producer-batch-size: 65536
        buffer-memory-bytes: 33554432
