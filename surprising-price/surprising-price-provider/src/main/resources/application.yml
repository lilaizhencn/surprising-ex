server:
  port: 9082

spring:
  application:
    name: surprising-price-provider
  task:
    scheduling:
      pool:
        size: 9
      thread-name-prefix: price-scheduler-
      shutdown:
        await-termination: true
        await-termination-period: 10s
  datasource:
    url: jdbc:postgresql://localhost:5432/surprising_exchange
    username: surprising
    password: surprising
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

surprising:
  price:
    consumer:
      bootstrap-servers: localhost:9092
      product-line: ${PRODUCT_LINE}
      group-id: surprising-mark-price-query-${HOSTNAME:${random.uuid}}
      max-age: 3s
      allowed-future-skew: 1s
      concurrency: 1
      max-poll-records: 500
    index:
      kafka:
        bootstrap-servers: localhost:9092
        product-line: ${PRODUCT_LINE}
        group-id: surprising-index-price-v1
        cache-group-id: surprising-index-price-cache-${HOSTNAME:${random.uuid}}
        concurrency: 2
        max-poll-records: 500
      http:
        connect-timeout: 2s
        request-timeout: 3s
        max-concurrent-requests: 32
        user-agent: surprising-price/1.0
        proxy-enabled: ${SURPRISING_PRICE_INDEX_HTTP_PROXY_ENABLED:false}
        proxy-host: ${SURPRISING_PRICE_INDEX_HTTP_PROXY_HOST:127.0.0.1}
        proxy-port: ${SURPRISING_PRICE_INDEX_HTTP_PROXY_PORT:7897}
      audit:
        retention: 3d
        cleanup-delay-ms: 60000
        cleanup-batch-size: 10000
        max-batches-per-run: 10
    mark:
      market-channel: ${PRICE_MARK_MARKET_CHANNEL:aeron:udp?endpoint=127.0.0.1:21407}
      aeron:
        hostnames: ${AERON_CLUSTER_HOSTNAMES:localhost,localhost,localhost}
        egress-hostname: ${AERON_EGRESS_HOSTNAME:localhost}
      kafka:
        bootstrap-servers: localhost:9092
        product-line: ${PRODUCT_LINE}
        concurrency: 2
        max-poll-records: 500
      audit:
        retention: 3d
        cleanup-delay-ms: 60000
        cleanup-batch-size: 10000
        max-batches-per-run: 10
